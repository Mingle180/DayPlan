<body>
<div id="app">
  <header class="app-header">
    <div class="header-left">
      <!-- 2026-11-01（用户口径）：字标去掉外围纸底、文字加深，深色顶栏另用奶油墨线版，
           避免暗色下露出一块奶油色矩形；两张图同尺寸，切换主题不跳动。 -->
      <img class="brand-mark brand-mark-light" src="assets/illustrations/brand-wordmark.png?v=20261112052429Z"
           alt="DayLight" width="400" height="126" draggable="false">
      <img class="brand-mark brand-mark-dark" src="assets/illustrations/brand-wordmark-dark.png?v=20261112052429Z"
           alt="" width="400" height="126" draggable="false" aria-hidden="true">
      <span class="header-branch" aria-hidden="true"></span>
    </div>
    <div class="header-right">
      <button id="btn-cloud-save" class="btn btn-plate btn-cloud-save" type="button" aria-label="保存到云端">保存</button>
      <div id="view-switch" class="view-switch" role="tablist" aria-label="视图模式">
        <button id="btn-view-year" class="view-switch-btn view-switch-year" type="button" role="tab"
                data-view="year" aria-pressed="false" title="年视图">年</button>
        <button id="btn-view-month" class="view-switch-btn" type="button" role="tab"
                data-view="month" aria-pressed="false" title="月视图（M）">月</button>
        <button id="btn-view-week" class="view-switch-btn" type="button" role="tab"
                data-view="week" aria-pressed="false" title="周视图（W）">周</button>
        <button id="btn-view-day" class="view-switch-btn is-active" type="button" role="tab"
                data-view="day" aria-pressed="true" title="日视图（D）">日</button>
      </div>
      <button id="btn-settings" class="btn btn-plate" type="button" aria-haspopup="dialog">设置</button>
    </div>
  </header>

  <!-- 警告条容器（存储降级 / 数据损坏 / 截断提示等） -->
  <div id="banners" class="banners" role="status" aria-live="polite"></div>

  <div class="app-body">
    <!-- 迭代 4（S26 / ADR-26）：左侧当月迷你月历已删除（#calendar-panel / #calendar / #calendar-foot） -->

    <!-- 主视图容器（月 / 周 / 日） -->
    <main class="panel-main" id="main-panel">
      <div id="view-month-root" class="view-root" data-view="month" hidden></div>
      <div id="view-week-root" class="view-root" data-view="week" hidden></div>

      <!-- 日视图（默认） -->
      <section id="day-panel" class="view-root panel-day" data-view="day">
        <!-- 迭代 10 批次 4（条8）：左右两栏 —— 左时间表、右记录栏（独立白底、与时间表等高相对静止） -->
        <div class="view-body" id="day-view-body">
          <div class="view-main">
            <!-- 时间轴区（按类别分行组，两侧空闲压缩为窄带）
                 2026-10-30：日期行收进时间轴卡片内部上方（用户口径） -->
            <section class="timeline-section" aria-label="时间轴">
              <div class="day-head">
                <div class="day-title-wrap">
                  <h1 id="day-title" class="day-title">—</h1>
                  <div id="day-sub" class="day-sub"></div>
                </div>
                <div class="head-actions">
                  <div class="date-nav" role="group" aria-label="日期导航">
                    <button id="btn-today" class="date-nav-btn is-current" type="button" title="回到今天（T）">今天</button>
                  </div>
                  <button id="btn-new-item" class="btn-add-round" type="button" title="新建事项（N）" aria-label="新建事项">+</button>
                </div>
              </div>
              <div class="timeline-scroll" id="timeline-scroll">
                <div class="timeline-inner" id="timeline-inner">
                  <div class="timeline-ruler" id="timeline-ruler"></div>
                  <div class="timeline-body" id="timeline-body">
                    <div class="timeline-track" id="timeline-track">
                      <div class="timeline-now" id="timeline-now" hidden>
                        <span class="timeline-now-label" id="timeline-now-label" aria-hidden="true"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- 五十一轮：下方一行 —— 左「未排时段」收窄，右「事项完成台」挪进空出的位置 -->
            <div class="lower-row">
              <!-- 无时段事项（时间表下方） -->
              <section class="untimed-section" aria-label="未排时段事项">
                <div class="section-head">
                  <h2 id="untimed-title">未排时段</h2>
                </div>
                <ul id="untimed-list" class="untimed-list"></ul>
                <p id="untimed-empty" class="empty-hint" hidden></p>
              </section>

              <section class="finish-dock" id="day-finish-dock" aria-label="事项完成台">
                <div class="section-head">
                  <h2>事项完成台</h2>
                  <span class="finish-dock-tools">
                    <span class="muted" id="finish-dock-count"></span>
                  </span>
                </div>
                <div class="finish-dock-body" id="finish-dock-body"></div>
              </section>
            </div>
          </div>

          <!-- 右侧栏：上「右栏图片」+「倒计时」（五十一轮）+ 下「今日记录」 -->
          <aside class="side-rail" id="day-rail" aria-label="右栏图片、倒计时与今日记录">
            <button class="rail-cover" id="day-rail-cover" type="button"
                    aria-label="更换今日图片" title="点击更换今日图片">
              <img class="rail-cover-img" alt="" hidden>
              <span class="rail-cover-brand" aria-hidden="true"></span>
              <span class="rail-cover-hint" aria-hidden="true">更换图片</span>
            </button>
            <section class="countdown-section" id="countdown-section" aria-label="倒计时">
              <div class="section-head">
                <h2>倒计时</h2>
                <span class="finish-dock-tools">
                  <button id="btn-new-countdown" class="btn btn-ghost btn-icon" type="button"
                          title="新建倒计时" aria-label="新建倒计时">+</button>
                </span>
              </div>
              <ul id="countdown-list" class="countdown-list"></ul>
              <div id="countdown-empty" class="cd-empty-art" aria-hidden="true" hidden></div>
            </section>

            <section class="notes-section" aria-label="今日记录">
              <div class="section-head">
                <h2>今日记录</h2>
                <span id="notes-status" class="muted"></span>
              </div>
              <textarea id="notes-input" class="notes-input" rows="4"
                aria-label="今日记录"></textarea>
              <div class="notes-foot">
                <span id="notes-count" class="notes-count">0字</span>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </div>
</div>
